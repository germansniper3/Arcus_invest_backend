name: Backend Deploy

# Builds and publishes the API container image to GitHub Container Registry.
# Runs on version tags (v*) or manual dispatch. Wire the final "deploy" step to
# your host (Railway CLI, `docker compose pull && up -d` over SSH to Hetzner,
# Render deploy hook, etc.) — image build + publish is provider-agnostic.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      # - name: Deploy to host
      #   run: |
      #     # e.g. ssh deploy@server 'cd /srv/arcus && docker compose pull && docker compose up -d'
      #     # or:  railway up --service arcus-api
