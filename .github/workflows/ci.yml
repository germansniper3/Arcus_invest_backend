name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: arcusinvest
          POSTGRES_USER: arcus
          POSTGRES_PASSWORD: arcus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arcus -d arcusinvest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://arcus:arcus@localhost:5432/arcusinvest?sslmode=disable
      JWT_SECRET: ci-test-secret-not-for-production
      FRONTEND_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Download modules
        run: go mod download

      # Formatting is a build concern, not a review concern. gofmt -l prints
      # files needing formatting and exits 0 either way, so the diff has to be
      # turned into the failure.
      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -race matters specifically here. The approvals gate is what stops one
      # authorisation being spent twice, and it relies on a conditional UPDATE
      # plus RowsAffected to arbitrate between concurrent retries. That is the
      # class of bug that passes every serial test and fails under load.
      #
      # DATABASE_URL is set at the job level, which is what makes this the full
      # suite. Without it the DB-backed tests call t.Skip and every package
      # still prints ok - 59 of 118 top-level tests silently do not run, and
      # they are the money ones.
      - name: Test (unit + DB integration, race detector)
        run: go test ./... -count=1 -race
